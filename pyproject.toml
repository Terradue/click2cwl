[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "click2cwl"
dynamic = ["version"]
description = 'Generates CWL documents and associated parameters from a Click CLI definition'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["CWL", "click", "cli"]
authors = [
  { name = "Blasco Brauzzi" },
  { name = "Fabrice Brito", email = "fabrice.brito@terradue.com" },
  { name = "Farid Yusifli" },
  { name = "Francis Charette-Migneault" },
  { name = "Michele Longobardo", email = "michele.longobardo@terradue.com" },
  { name = "Simone Tripodi", email = "simone.tripodi@terradue.com" },
  { name = "Simone Vaccari", email = "simone.vaccari@terradue.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click==8.4.2",
  "PyYAML==6.0.3"
]


[project.urls]
Documentation = "https://terradue.github.io/click2cwl/"
Issues = "https://github.com/Terradue/click2cwl/issues"
Source = "https://github.com/Terradue/click2cwl"

[tool.hatch.version]
path = "src/click2cwl/__about__.py"


[tool.hatch.envs.default]
skip-install = false

[tool.hatch.envs.prod]
path = "/app/envs/click2cwl"

[tool.coverage.run]
source_pkgs = ["click2cwl", "tests"]
branch = true
parallel = true
omit = [
  "src/click2cwl/__about__.py",
]

[tool.coverage.paths]
click2cwl = ["src/click2cwl", "*/click2cwl/src/click2cwl"]
tests = ["tests", "*/click2cwl/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.test]
skip-install = false
dependencies = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
testv = "pytest --verbose {args:tests}"
test-cov = "pytest --cov=click2cwl --cov-report=term-missing {args:tests}"
test-show-setup = "pytest --setup-show"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.dev]
skip-install = false
dependencies = [
  "pytest==9.1.1",
  "mypy>=2.3.0",
  "ruff>=0.16.0",
  "bandit>=1.9.4",
]

[tool.ruff.lint]
# Start with the essential rules
select = [
  "F",    # Pyflakes (Critical for bugs)
  "E",    # pycodestyle Errors
  "W",    # pycodestyle Warnings
  "I",    # isort (Import sorting)
  "UP",   # pyupgrade (Modern syntax)
  "B",    # flake8-bugbear (Common bugs)
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "FA",   # flake8-future-annotations
  "TC",   # flake8-type-checking
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "C90",  # McCabe Complexity (Enables C901)
]

# Ignore rules that conflict with the formatter (Ruff Format/Black)
ignore = [
  "E501", # Line too long (handled by formatter)
  "W191", # Tab indentation (handled by formatter)
  "E111", # Indentation issues (handled by formatter)
  "E114", # Indentation issues (handled by formatter)
  "E117", # Over-indented (handled by formatter)
]

[tool.ruff.lint.mccabe]
# Flag errors (C901) whenever complexity exceeds 10 (default is 10)
max-complexity = 10

[tool.hatch.envs.dev.scripts]
typecheck = "mypy --install-types --non-interactive {args:src tests}"
lint = "ruff format {args:src tests}"
check = "ruff check --fix {args:src tests}"
security = "bandit -r {args:src}"
